name: "IntentusNet MCP Scan"
description: "Security-scan an MCP server's advertised tools and fail the build on risky findings."
branding:
  icon: "shield"
  color: "blue"

inputs:
  http:
    description: "HTTP MCP server URL to scan (mutually exclusive with stdio)."
    required: false
    default: ""
  stdio:
    description: "stdio MCP server launch command to scan (mutually exclusive with http)."
    required: false
    default: ""
  fail-on:
    description: "Fail the job if any finding is at or above this severity (critical|high|medium|low|info)."
    required: false
    default: "high"
  json-report:
    description: "Optional path to write the JSON scan report to."
    required: false
    default: ""
  version:
    description: "intentusnet version spec to install (e.g. '==1.5.1' or '' for latest)."
    required: false
    default: ""

runs:
  using: "composite"
  steps:
    - name: Install intentusnet
      shell: bash
      run: python -m pip install --quiet "intentusnet${{ inputs.version }}"

    - name: Run MCP scan
      shell: bash
      run: |
        set -euo pipefail
        ARGS=(--fail-on "${{ inputs.fail-on }}")
        if [ -n "${{ inputs.http }}" ]; then
          ARGS+=(--http "${{ inputs.http }}")
        elif [ -n "${{ inputs.stdio }}" ]; then
          ARGS+=(--stdio "${{ inputs.stdio }}")
        else
          echo "::error::mcp-scan requires either 'http' or 'stdio' input"
          exit 2
        fi

        # Human-readable output in the log.
        intentus-scan "${ARGS[@]}" --no-color
        STATUS=$?

        # Optional machine-readable artifact (does not affect pass/fail).
        if [ -n "${{ inputs.json-report }}" ]; then
          intentus-scan "${ARGS[@]}" --json > "${{ inputs.json-report }}" || true
        fi

        exit $STATUS
